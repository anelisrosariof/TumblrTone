<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TumblrTone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <h1>Tumblr Tone</h1>
    <p class="subtitle">/ love letters & digital aesthetics</p>

    <div class="controls-bar">
      <label class="custom-file-upload">
        <input type="file" accept="image/*" id="fileInput">
        Choose Photo
      </label>
      <button id="cameraBtn">Live Camera</button>
    </div>

    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>

    <div id="filters">
      <button data-filter="none" class="active">Original</button>
      <button data-filter="bleach">Bleach Bypass</button>
      <button data-filter="2014">2014</button>
      <button data-filter="amaro">Amaro</button>
      <button data-filter="nashville">Nashville</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
