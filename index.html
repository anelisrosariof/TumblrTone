<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TumblrTone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tumblr Tone Filters</h1>

  <input type="file" accept="image/*" id="fileInput">
  <button id="cameraBtn">Live Camera</button>

  <!-- Container handles the filter styling -->
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="filters">
    <button data-filter="none" class="active">Original</button>
    <button data-filter="bleach">Bleach Bypass</button>
    <button data-filter="2014">2014</button>
    <button data-filter="amaro">Amaro</button>
    <button data-filter="nashville">Nashville</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
